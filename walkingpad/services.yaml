start:
  name: Start
  description: Startet das WalkingPad Band.

stop:
  name: Stop
  description: Stoppt das WalkingPad Band.

set_speed:
  name: Geschwindigkeit setzen
  description: Setzt die Geschwindigkeit des WalkingPad.
  fields:
    speed:
      name: Geschwindigkeit
      description: Zielgeschwindigkeit in km/h (0.5 - 6.0)
      required: true
      selector:
        number:
          min: 0.5
          max: 6.0
          step: 0.5
          unit_of_measurement: km/h
          mode: slider
